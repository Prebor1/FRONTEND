<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RGB színkeverés</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!--SZINEK-->
    <table>
        <tbody>
            <tr>
                <td>Piros:</td>
                <td><input type="range" id="red-range" min="0" max="255" value="0" ></td>
                <td><input type="number" id="red-value" min="0" max="255" value="0"></td>
            </tr>

            <tr>
                <td>Zöld</td>
                <td><input type="range" id="green-range" min="0" max="255" value="0" ></td>
                <td><input type="number" id="green-value" min="0" max="255" value="0"></td>
            </tr>

            <tr>
                <td>Kék</td>
                <td><input type="range" id="blue-range" min="0" max="255" value="0" ></td>
                <td><input type="number" id="blue-value" min="0" max="255" value="0"></td>
            </tr>

            <tr>
                <td>Átlátszóság</td>
                <td><input type="range" id="alpha-range" min="0" max="1" value="1" step="0.01"></td>
                <td><input type="number" id="alpha-value" min="0" max="1" value="1" step="0.01"></td>
            </tr>
        </tbody>
    </table> 

    <!--MERETEK-->
    <table>
        <tbody>
            <tr>
                <td>Szélesség:</td>
                <td><input type="range" id="width-range" min="0" max="600" value="200"></td>
                <td><input type="number" id="width-value" min="0" max="600" value="200"></td>
            </tr>

            <tr>
                <td>Magasság:</td>
                <td><input type="range" id="height-range" min="0" max="400" value="200"></td>
                <td><input type="number" id="height-value" min="0" max="400" value="200"></td>
            </tr>

            <tr>
                <td>Border radius:</td>
                <td><input type="range" id="border-range" min="0" max="300" value="0"></td>
                <td><input type="number" id="border-value" min="0" max="300" value="0"></td>
            </tr>

            <tr>
                <td>Forgatas</td>
                <td><input type="range" id="rotate-range" min="0" max="360" value="0"></td>
                <td><input type="number" id="rotate-value" min="0" max="360" value="0"></td>
            </tr>

        </tbody>
    </table>

    <div id="rgb-box">

    </div>
    
    <script src="index.js"></script>
</body>
</html>
